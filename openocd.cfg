# OpenOCD Configuration for AT32F421 with DAPLink
# Uses compiled OpenOCD from tools/windows/openocd with native AT32F421 support

# Use DAPLink/CMSIS-DAP interface
source [find interface/cmsis-dap.cfg]

# Select SWD transport
transport select swd

# Use AT32F421 target configuration
source [find target/at32f421xx.cfg]

# Lower adapter speed for more reliable communication with faulty firmware
adapter speed 4000


# Fix reset configuration - avoid SRST assertion issues
reset_config none

# Alternative reset configs to try if 'none' doesn't work:
# reset_config srst_only
# reset_config connect_deassert_srst

# Target configuration for debugging faulty firmware
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x2000 -work-area-backup 0

# Connect under reset to handle double faults
init
reset halt
